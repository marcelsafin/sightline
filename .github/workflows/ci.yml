name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-budget.mjs
      - name: No planted answers in the fixture (constitution III)
        run: |
          ! grep -rn "data-fix" src/demo.ts dist/assets/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
