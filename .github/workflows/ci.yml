name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/bundle-budget.mjs
      - name: No planted answers in the fixture (constitution III)
        run: |
          ! grep -rn "data-fix" src/demo.ts dist/assets/*.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  webmcp-smoke:
    # End-to-end through Chrome's native WebMCP DevTools domain: the page is
    # driven as an external agent would drive it (constitution VI).
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - run: npm ci
      - run: npm run build
      - run: python3 -m pip install --quiet websocket-client
      - name: Serve the production build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 20); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 0.5; done
      - name: Native WebMCP smoke (15 invariants)
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 scripts/webmcp-smoke.py http://localhost:4173
